server {
    listen 80;
    server_name app.rnp25.com;
    
    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name app.rnp25.com;
    
    # SSL configuration
    # Replace these paths with your actual SSL certificate paths
    ssl_certificate /etc/letsencrypt/live/app.rnp25.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.rnp25.com/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";
    
    # Frontend app location
    location / {
        root /usr/share/nginx/html/app.rnp25.com;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    
    # API proxying (if needed)
    location /api/ {
        proxy_pass https://api.rnp25.com/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
} 